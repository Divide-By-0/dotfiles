# New windows / splits open in the REAL current dir, not secretty's frozen "/".
# REASON: #{pane_current_path} reports the secretty wrapper's cwd (/), not where the
# shell/agent actually is. ~/.tmux/real-cwd.sh walks the live process tree (which sees
# through secretty) and returns the deepest non-plugin descendant's real cwd. run-shell
# expands #{pane_pid} to the pane the key was pressed in.
bind c run-shell 'D="$($HOME/.tmux/real-cwd.sh #{pane_pid})"; tmux new-window  -c "$D" -e TMUX_START_DIR="$D"'
bind '"' run-shell 'D="$($HOME/.tmux/real-cwd.sh #{pane_pid})"; tmux split-window -v -c "$D" -e TMUX_START_DIR="$D"'
bind %  run-shell 'D="$($HOME/.tmux/real-cwd.sh #{pane_pid})"; tmux split-window -h -c "$D" -e TMUX_START_DIR="$D"'

# REASON: by default tmux auto-renames each window after its foreground process
# (e.g. "secretty"), which is useless for navigation. Name windows after the
# basename of the pane's current directory instead (#{b:...} = basename).
# Keeps the default format's [tmux] (copy-mode) and [dead] indicators.
set -g automatic-rename-format '#{?pane_in_mode,[tmux],#{b:pane_current_path}}#{?pane_dead,[dead],}'
# REASON: continuum-save-interval is in minutes. 15 is a good balance between
# not losing much work and not writing to disk too frequently, which could
# cause micro-stutters on slower storage.
set -g @continuum-save-interval '15'

# REASON: com.aayush.tmux-autostart now performs the restore synchronously and
# validates the recovered pane count before it exits. Continuum's background
# restore has no durable result or error log and raced the login-time save job,
# which left only the empty bootstrap session after the 2026-08-22 reboot.
set -g @continuum-restore 'off'

# REASON: capture-pane-contents 'on' makes resurrect snapshot the on-screen text
# of every pane and replay it on restore, so after a reboot you see the last
# screenful of output instead of a blank pane. Restore order is: cat the saved
# text, THEN exec the relaunch command — so for the claude/codex TUIs you briefly
# see the old frame before the app redraws; for plain shell panes the text stays.
# NOTE: default capture area is 'visible' (last screenful). To capture the entire
# scrollback instead, add: set -g @resurrect-pane-contents-area 'full' — left off
# because 'full' on alt-screen TUIs (claude/codex) saves mostly redraw noise.
set -g @resurrect-capture-pane-contents 'on'

# REASON: By default resurrect only restores a conservative list of programs
# (vi, vim, nvim, emacs, etc). Our workflow uses claude, codex, and agent in
# named tmux windows. The tilde ~ matches the process name anywhere in the
# command string, and -> specifies the exact command to run on restore (since
# the saved process string may include full paths or --resume flags that are
# stale after a reboot).
#
# The FIRST rule has no -> on purpose. A rule without an arrow whitelists the
# saved command and runs it VERBATIM, which is how each pane gets its OWN
# resume line: ~/.tmux/resurrect-secretty-fix.sh resolves a per-pane session id
# at save time and writes "~/.tmux/tmux-resume-pane.sh cc|cx <id>" into the save
# file's field 11. See that script's header for why the arrow rules below could
# not do this — they map a process NAME to ONE fixed command, so every pane in a
# directory resolved to the same conversation. Measured on the 2026-08-10 reboot:
# 6 of 15 codex panes died with "thread <uuid> already has an active writer".
#
# The arrow rules stay as the fallback for panes whose id could not be resolved
# and for cursor-agent, which exposes no per-session handle:
#   claude --continue  -> resumes the most recent conversation in the pane's cwd
#   codex resume --last -> continues the most recent codex session (cwd-filtered,
#                          picker disabled). NOTE: `codex resume` does NOT accept
#                          --dangerously-bypass-approvals-and-sandbox (that flag is
#                          on the root command, not the resume subcommand, so it's
#                          silently ignored on resume). To restore in full-auto/yolo
#                          mode we pass the equivalent config overrides instead:
#                          -c tui.resume_cwd=current
#                          -c sandbox_mode=danger-full-access -c approval_policy=never
#                          (values parse as literal strings; resume honors -c).
#   agent --continue   -> continues the previous agent session
# These are cwd-sensitive, which is why resurrect restoring each pane's working
# directory matters. Edge case: if a pane's cwd has NO prior conversation, the
# --continue/resume command exits immediately and the pane drops to a shell.
#
# WARNING: matching is a SUBSTRING regex over the whole saved command line, and
# _get_inline_strategy concatenates the command of EVERY arrow rule that matches
# rather than stopping at the first. That is why tmux-resume-pane.sh takes "cc"
# and "cx" instead of "claude" and "codex" — the agent names appearing anywhere
# in the line, even as an argument, would splice the fallback commands onto it.
set -g @resurrect-processes '"~tmux-resume-pane" "~claude->claude --continue --dangerously-skip-permissions" "~codex->codex resume --last -c tui.resume_cwd=current -c sandbox_mode=danger-full-access -c approval_policy=never" "~agent->agent --continue -f"'

# REASON: ~/.zshrc renames a tmux session to its first pane's cwd basename from a
# precmd hook. Resurrect creates ALL panes first and only then sends each pane its
# relaunch command, addressed by the session name stored in the save file — so
# restored shells reaching their first prompt rename sessions out from under that
# second phase, and every pane in a renamed session is skipped in silence
# (pane_exists fails -> return 1, which is not even the "not auto-restored" echo
# path). That cost 10 of 38 agent panes on the 2026-08-10 reboot. The guard freezes
# session renaming for the duration of the restore and does it once at the end.
set -g @resurrect-hook-pre-restore-all '$HOME/.tmux/resurrect-restore-guard.sh pre'
set -g @resurrect-hook-post-restore-all '$HOME/.tmux/resurrect-restore-guard.sh post'

# REASON: every pane is wrapped by `secretty` (secretty -> zsh -> codex/claude/agent),
# so tmux's #{pane_current_path} and #{pane_full_command} — which resurrect saves —
# report the OUTER secretty process: cwd frozen at / and command always /bin/zsh.
# That made restores land in / and never resume the inner agent. tmux can't see
# through secretty but `ps`/`lsof` on the live tree can, so this post-save hook
# rewrites the just-saved file: each pane's dir -> the deepest descendant's real cwd,
# and panes running an agent get their command set to codex/claude/agent so the
# @resurrect-processes rules above match and resume them. Fail-safe: it never
# overwrites the save unless every line is preserved. See the script header for detail.
set -g @resurrect-hook-post-save-all '$HOME/.tmux/resurrect-secretty-fix.sh'

# REASON: tmux has no before-kill-server hook. Make the manual "kill the whole
# server" path save a fresh tmux-resurrect snapshot first, then terminate the
# server only after the save script exits. The zsh wrapper below covers typed
# `tmux kill-server`; this binding covers in-tmux interactive use.
bind K confirm-before -p "Save tmux-resurrect state and kill server? (y/n)" 'run-shell "$HOME/.tmux/plugins/tmux-resurrect/scripts/save.sh quiet" \; kill-server'
