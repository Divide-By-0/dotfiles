name: Codex network recovery
on:
  pull_request:
    paths: ['macos/codex-network-recovery/**', '.github/workflows/codex-network-recovery.yml']
  push:
    paths: ['macos/codex-network-recovery/**', '.github/workflows/codex-network-recovery.yml']
jobs:
  recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s macos/codex-network-recovery/tests -v
