name: Moshi cmux integration
on:
  pull_request:
    paths: ['macos/agent-session-recovery/**', '.github/workflows/moshi-cmux.yml']
  push:
    paths: ['macos/agent-session-recovery/**', '.github/workflows/moshi-cmux.yml']
jobs:
  grouped-tabs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: PYTHONDONTWRITEBYTECODE=1 python3 macos/agent-session-recovery/tests/test_moshi_groups.py -v
      - run: PYTHONDONTWRITEBYTECODE=1 python3 macos/agent-session-recovery/tests/test_pty_capacity.py -v
      - run: PYTHONDONTWRITEBYTECODE=1 python3 macos/agent-session-recovery/tests/test_moshi_example.py -v
